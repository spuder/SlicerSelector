name: Build and Release

on:
  push:
    tags:
      - "v*" # Only trigger on version tags starting with 'v'

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up environment
        env:
          AC_USERNAME: ${{ secrets.AC_USERNAME }}
          AC_PASSWORD: ${{ secrets.AC_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          SIGNING_CERTIFICATE: ${{ secrets.SIGNING_CERTIFICATE }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          CERT_NAME: ${{ secrets.CERT_NAME }}
        run: |
          echo "AC_USERNAME=$AC_USERNAME" >> $GITHUB_ENV
          echo "AC_PASSWORD=$AC_PASSWORD" >> $GITHUB_ENV
          echo "TEAM_ID=$TEAM_ID" >> $GITHUB_ENV
          echo "SIGNING_CERTIFICATE=$SIGNING_CERTIFICATE" >> $GITHUB_ENV
          echo "SIGNING_CERTIFICATE_PASSWORD=$SIGNING_CERTIFICATE_PASSWORD" >> $GITHUB_ENV
          echo "CERT_NAME=$CERT_NAME" >> $GITHUB_ENV

      - name: Import signing certificate
        run: |
          echo "$SIGNING_CERTIFICATE" | base64 --decode > developer_id.p12
          security create-keychain -p temp build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temp build.keychain
          security import developer_id.p12 -k build.keychain \
            -P "$SIGNING_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k temp build.keychain
          security find-identity -v -p codesigning

      - name: Debug certificate name
        run: |
          echo "CERT_NAME=$CERT_NAME"

      - name: Verify certificate
        run: |
          security find-identity -v -p codesigning

      - name: Build app
        run: |
          make build
          make modify_plist

      - name: Sign app
        run: |
          make resign

      - name: Notarize app
        run: |
          make notarize

      - name: Verify notarization
        run: |
          xcrun stapler validate SlicerSelector.app
          spctl -a -vv SlicerSelector.app

      - name: Create ZIP archive
        run: |
          ditto -c -k --keepParent SlicerSelector.app SlicerSelector.app.zip

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: ./SlicerSelector.app.zip

      - name: Get SHA256
        id: shasum
        run: |
          echo "sha=$(shasum -a 256 SlicerSelector.app.zip | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Generate GitHub App Token
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: spuder
          repositories: homebrew-SlicerSelector

      - name: Checkout homebrew-SlicerSelector
        uses: actions/checkout@v4
        with:
          repository: spuder/homebrew-SlicerSelector
          path: homebrew-SlicerSelector
          token: ${{ steps.generate_token.outputs.token }}

      - name: Update Cask
        run: |
          version=$(echo ${{ github.ref }} | sed 's|^refs/tags/v||')
          cd homebrew-SlicerSelector

          # Update version and SHA256
          sed -i '' "s|version \".*\"|version \"$version\"|" Casks/slicer-selector.rb
          sed -i '' "s|sha256 \".*\"|sha256 \"${{ steps.shasum.outputs.sha }}\"|" Casks/slicer-selector.rb

          # Commit and push changes
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add Casks/slicer-selector.rb
          git commit -m "Update cask to version $version"
          git push
        if: startsWith(github.ref, 'refs/tags/v')
